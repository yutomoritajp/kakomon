[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.137.2",
    "sqlModel>=0.0.38",
    "psycopg[binary]>=3.3",
    "alembic>=1.13",
    "anthropic>=0.120.2",
    "pymupdf>=1.28.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.13"
exclude = ["**/__pycache__", "**/node_modules", "**/.*", "temp", "past_exams", "data"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]